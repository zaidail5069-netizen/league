<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E8A5F">
<title>دوري الفصول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== تنسيق الغلاف فقط — واجهة التطبيق تأتي مع app.js ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#EDF1F7;color:#0F1B2D;font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.7}
#boot{
  position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;
  background:linear-gradient(150deg,#12A36F,#0B7350);color:#fff;z-index:9999;
}
#boot .in{max-width:420px}
#boot h1{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:26px;margin:0 0 6px}
#boot p{opacity:.9;font-size:14px;margin:0}
.spin{
  width:40px;height:40px;margin:0 auto 18px;border-radius:50%;
  border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
#rec{display:none;position:fixed;inset:0;z-index:9998;overflow-y:auto;padding:18px;background:#EDF1F7}
#rec .box{max-width:520px;margin:0 auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 22px -12px rgba(15,35,70,.28)}
#rec h2{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:20px;margin:0 0 4px}
#rec .sub{color:#6C7C93;font-size:13.5px;margin-bottom:16px}
#rec label{display:block;font-size:13px;color:#6C7C93;font-weight:700;margin:14px 0 6px}
#rec input{width:100%;background:#fff;border:1.5px solid #E4EAF3;border-radius:14px;padding:12px 14px;font-family:inherit;font-size:16px}
#rec input:focus{outline:none;border-color:#0E8A5F}
#rec .btn{
  display:block;width:100%;margin-top:12px;padding:14px;border-radius:15px;border:none;cursor:pointer;
  font-family:"Baloo Bhaijaan 2",sans-serif;font-size:16px;font-weight:700;background:#0E8A5F;color:#fff;
}
#rec .btn.ghost{background:#EEF2F8;color:#0F1B2D}
#rec .btn.warn{background:#FDECEC;color:#EF4D4D}
#rec .btn:disabled{opacity:.5;cursor:default}
#rec .msg{margin-top:14px;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.8}
#rec .msg.err{background:#FDECEC;color:#B93636}
#rec .msg.ok{background:#DFF5EA;color:#0B7350}
#rec .msg.info{background:#F5F8FC;color:#6C7C93}
#rec .ver{font-size:12px;color:#6C7C93;margin-top:10px;text-align:center}
</style>
</head>
<body>

<div id="boot"><div class="in">
  <div class="spin"></div>
  <h1>دوري الفصول</h1>
  <p id="bootMsg">جارٍ التحميل…</p>
</div></div>

<div id="root"></div>

<div id="rec"><div class="box">
  <h2>لوحة تحديث التطبيق</h2>
  <div class="sub" id="recSub">خاصة برائد النشاط</div>
  <div id="recBody"></div>
</div></div>

<script type="module">
/* ==========================================================
   الغلاف الثابت — يُرفع مرة واحدة على GitHub Pages ولا يتغيّر
   ----------------------------------------------------------
   ١) الصق إعدادات Firebase أدناه (Project settings ▸ Web app).
   ٢) Firestore ▸ Rules:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /classLeague/{doc} {
              allow read: if true;                  // الطلاب: قراءة فقط
              allow write: if request.auth != null; // الرائد فقط
            }
          }
        }
   ٣) Authentication ▸ Email/Password ▸ أنشئ حساب الرائد.
   ٤) ارفع هذا الملف على GitHub Pages، ثم افتحه وأضف ‎#update
      إلى الرابط لرفع أول نسخة من app.js.
   ========================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCkTpI7GL8seHGuMeMR1aUSBGMcdAsC9gI",
  authDomain: "school-league-94cc4.firebaseapp.com",
  projectId: "school-league-94cc4",
  storageBucket: "school-league-94cc4.firebasestorage.app",
  messagingSenderId: "994287913934",
  appId: "1:994287913934:web:68841bc901287f6dac799f"
};

const COL = "classLeague", APP_DOC = "app", DATA_DOC = "main";
const $ = s => document.querySelector(s);
let fsMod = null, db = null, authMod = null, A = null, appRef = null, dataRef = null;
let isAdmin = false, recOpen = false, curVer = 0, hasPrev = false, booted = false;

const setBoot = t => { const e = $("#bootMsg"); if (e) e.textContent = t; };
const hideBoot = () => { const e = $("#boot"); if (e) e.style.display = "none"; };

/* ---------- تشغيل شيفرة التطبيق ---------- */
function runApp(code, ver) {
  curVer = ver || 0;
  const s = document.createElement("script");
  s.textContent = code;
  document.body.appendChild(s);
  setTimeout(() => {
    if (window.__APP_OK) { hideBoot(); booted = true; }
    else openRec("النسخة الحالية من التطبيق لم تعمل. جرّب الرجوع للنسخة السابقة أو ارفع ملفًا صحيحًا.");
  }, 900);
}
window.addEventListener("error", e => {
  if (!booted && !recOpen && !window.__APP_OK) openRec("خطأ في شيفرة التطبيق: " + (e.message || ""));
});

/* ---------- لوحة التحديث والإنقاذ ---------- */
function openRec(msg) {
  recOpen = true; hideBoot();
  $("#rec").style.display = "block";
  renderRec(msg ? { text: msg, kind: "err" } : null);
}
function closeRec() { recOpen = false; $("#rec").style.display = "none"; }

function renderRec(note) {
  const b = $("#recBody");
  if (!FIREBASE_CONFIG.apiKey) {
    b.innerHTML = `<div class="msg err">لم تُضف إعدادات Firebase في هذا الملف بعد.
      افتح الملف وألصق القيم في <b>FIREBASE_CONFIG</b> ثم أعد رفعه مرة واحدة.</div>`;
    return;
  }
  if (!isAdmin) {
    b.innerHTML = `
      ${note ? `<div class="msg ${note.kind}">${note.text}</div>` : ""}
      <label>البريد الإلكتروني</label><input id="rE" type="email" autocomplete="username">
      <label>كلمة المرور</label><input id="rP" type="password" autocomplete="current-password">
      <button class="btn" id="rLogin">دخول رائد النشاط</button>
      ${booted ? `<button class="btn ghost" id="rBack">رجوع للتطبيق</button>` : ""}`;
    $("#rLogin").onclick = async () => {
      try {
        await authMod.signInWithEmailAndPassword(A, $("#rE").value.trim(), $("#rP").value);
      } catch (e) { renderRec({ text: "بيانات الدخول غير صحيحة", kind: "err" }); }
    };
    if ($("#rBack")) $("#rBack").onclick = closeRec;
    return;
  }
  b.innerHTML = `
    ${note ? `<div class="msg ${note.kind}">${note.text}</div>` : ""}
    <div class="msg info">اختر ملف <b>app.js</b> الجديد ثم اضغط نشر. سيصل التحديث لكل الأجهزة فورًا،
      وبيانات الدوري (الفصول والنتائج والمواعيد) لا تتأثر إطلاقًا.</div>
    <label>ملف التطبيق (app.js)</label>
    <input id="rFile" type="file" accept=".js,.txt,text/javascript">
    <button class="btn" id="rPub">نشر النسخة الجديدة</button>
    ${hasPrev ? `<button class="btn warn" id="rRoll">الرجوع للنسخة السابقة</button>` : ""}
    ${booted ? `<button class="btn ghost" id="rBack">رجوع للتطبيق</button>` : ""}
    <button class="btn ghost" id="rOut">خروج</button>
    <div class="ver">النسخة الحالية: ${curVer ? new Date(curVer).toLocaleString("ar") : "لا توجد"}</div>`;

  $("#rPub").onclick = async () => {
    const f = $("#rFile").files[0];
    if (!f) return renderRec({ text: "اختر الملف أولًا", kind: "err" });
    const code = await f.text();
    if (code.length < 2000 || code.indexOf("LEAGUE_APP") === -1)
      return renderRec({ text: "هذا الملف لا يبدو ملف التطبيق. تأكد أنك اخترت app.js الصحيح.", kind: "err" });
    $("#rPub").disabled = true; $("#rPub").textContent = "جارٍ النشر…";
    try {
      const snap = await fsMod.getDoc(appRef);
      const prev = snap.exists() ? (snap.data().code || "") : "";
      await fsMod.setDoc(appRef, { code, prev, version: Date.now() });
      location.reload();
    } catch (e) {
      $("#rPub").disabled = false; $("#rPub").textContent = "نشر النسخة الجديدة";
      renderRec({ text: "تعذّر النشر: " + (e.code || e.message), kind: "err" });
    }
  };
  if ($("#rRoll")) $("#rRoll").onclick = async () => {
    if (!confirm("الرجوع للنسخة السابقة من التطبيق؟")) return;
    try {
      const snap = await fsMod.getDoc(appRef); const d = snap.data() || {};
      if (!d.prev) return renderRec({ text: "لا توجد نسخة سابقة", kind: "err" });
      await fsMod.setDoc(appRef, { code: d.prev, prev: d.code || "", version: Date.now() });
      location.reload();
    } catch (e) { renderRec({ text: "تعذّر الرجوع: " + (e.code || e.message), kind: "err" }); }
  };
  if ($("#rBack")) $("#rBack").onclick = closeRec;
  $("#rOut").onclick = async () => { await authMod.signOut(A); };
}

/* ---------- الإقلاع ---------- */
async function start() {
  if (!FIREBASE_CONFIG.apiKey) {
    if (location.hash === "#update") return openRec();
    /* وضع محلي للتجربة: يقرأ app.js من نفس المجلد ويحفظ في المتصفح */
    setBoot("وضع التجربة المحلي…");
    try {
      const r = await fetch("./app.js?t=" + Date.now());
      if (!r.ok) throw new Error("app.js غير موجود");
      window.__updater = { open: () => openRec("الوضع المحلي: التحديث الذاتي يحتاج إعدادات Firebase.") };
      runApp(await r.text(), 0);
    } catch (e) { openRec("تعذّر تحميل app.js: " + e.message); }
    return;
  }
  setBoot("الاتصال بالخادم…");
  let initializeApp;
  try {
    const [a, f, u] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
    ]);
    initializeApp = a.initializeApp; fsMod = f; authMod = u;
  } catch (e) { return openRec("تعذّر تحميل مكتبات Firebase. تأكد من الاتصال بالإنترنت."); }

  const app = initializeApp(FIREBASE_CONFIG);
  db = fsMod.getFirestore(app); A = authMod.getAuth(app);
  appRef = fsMod.doc(db, COL, APP_DOC);
  dataRef = fsMod.doc(db, COL, DATA_DOC);

  authMod.onAuthStateChanged(A, u => { isAdmin = !!u; if (recOpen) renderRec(); });
  window.__FB = { fs: fsMod, db, auth: authMod, A, dataRef, appRef };
  window.__updater = { open: () => openRec() };

  if (location.hash === "#update") return openRec();

  setBoot("تحميل التطبيق…");
  try {
    const snap = await fsMod.getDoc(appRef);
    const d = snap.exists() ? snap.data() : null;
    hasPrev = !!(d && d.prev);
    if (!d || !d.code) return openRec("لم تُرفع نسخة التطبيق بعد. سجّل الدخول وارفع ملف app.js.");
    runApp(d.code, d.version);
  } catch (e) {
    openRec("تعذّر تحميل التطبيق: " + (e.code || e.message) + " — تحقّق من قواعد Firestore.");
  }
}
start();
</script>
</body>
</html>
